[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numberbank"
version = "1.0.0"
description = "سامانه کشف، اعتبارسنجی و مدیریت شماره‌های تماس تجاری (شوینده، بهداشتی، آرایشی، سلولزی) در سراسر ایران"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NumberBank Team" }]
keywords = ["iran", "business-directory", "phone-validation", "web-scraping", "lead-generation"]

dependencies = [
    "httpx[http2]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "rich>=13.0",
    "selectolax>=0.3.16",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.6",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
excel = ["openpyxl>=3.1"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
numberbank = "numberbank.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
numberbank = ["web/templates/*.html", "web/static/*", "data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: تست‌هایی که به اینترنت واقعی نیاز دارند",
    "slow: تست‌های کند",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]
